# Render Blueprint —— 一键部署「AI 热点监控工具」(免费档)
# 使用方法：登录 render.com → New + → Blueprint → 选择 hot_monitor_main 仓库
# 详细步骤见 docs/DEPLOY_RENDER.md
services:
  - type: web
    name: hot-monitor
    runtime: docker
    repo: https://github.com/moonSCX/hot_monitor_main
    plan: free
    healthCheckPath: /api/health
    envVars:
      # SQLite 数据库（免费档为临时存储，每次重启自动迁移重建）
      - key: DATABASE_URL
        value: file:./dev.db
      # 前端同源部署时可不填；若需跨域可填 https://hot-monitor.onrender.com
      - key: CLIENT_URL
        sync: false
      # 以下密钥请在创建服务时于面板中填写（sync: false 表示值不写入仓库）
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TWITTER_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
